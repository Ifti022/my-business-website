<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Business Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header>
        <div class="logo">MyBusiness</div>
        <nav>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1>We Grow Your Business</h1>
        <p>Professional Web Development & Digital Solutions</p>
        <a href="#contact" class="btn">Get Started</a>
    </section>

    <!-- Services Section -->
    <section id="services" class="services">
        <h2>Our Services</h2>
        <div class="service-box">
            <h3>Web Development</h3>
            <p>Modern and responsive websites for your brand.</p>
        </div>
        <div class="service-box">
            <h3>Digital Marketing</h3>
            <p>Grow your reach and get more customers.</p>
        </div>
    </section>

    <!-- Contact Form Section -->
    <section id="contact" class="contact">
        <h2>Contact Us</h2>
        <form id="contactForm" action="https://formspree.io/f/xeaokben" method="POST">
            <input type="text" id="name" placeholder="Your Name" required>
            <input type="email" id="email" placeholder="Your Email" required>
            <textarea id="message" placeholder="Your Message" required></textarea>
            <button type="submit" class="btn">Send Message</button>
        </form>
    </section>
<form action="https://formspree.io/f/xeaokben" method="POST">

    <input type="text" name="name" placeholder="Your Name" required>

    <input type="email" name="email" placeholder="Your Email" required>

    <textarea name="message" placeholder="Your Message" required></textarea>

    <button type="submit">Send Message</button>

</form>
</body>
</html>
